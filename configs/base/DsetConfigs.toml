
cache_dir = "cache/datasets"


##############
# ICC Dataset Configs
#############

[ICC.builderConfigs.no_labels]
variant_name = "no_labels"
version = "0.0.1"
seed = 42
add_eos_tok_bw_turns = false
[ICC.builderConfigs.no_labels.data_files]
# NOTE: These are simlply the defaults that can be updated. 
train = "data/raw/ICC/28_train_14_test_set/train"
test = "data/raw/ICC/28_train_14_test_set/test"
[ICC.builderConfigs.no_labels.additional_special_tokens]
eos_token = "<ts>"


[ICC.builderConfigs.labels]
variant_name = "labels"
version = "0.0.1"
seed = 42
add_eos_tok_bw_turns = false
[ICC.builderConfigs.labels.data_files]
# NOTE: These are simlply the defaults that can be updated. 
train = "data/raw/ICC/28_train_14_test_set/train"
test = "data/raw/ICC/28_train_14_test_set/test"
[ICC.builderConfigs.labels.additional_special_tokens]
sp_start_token = "<START>"
sp_end_token = "<END>"
eos_token = "|<endoftext>|"


##############
# Speaker Identity Configs
#############

[speakerIdentity.builderConfigs.no_labels]
variant_name = "no_labels"
version = "0.0.1"
seed = 42
# NOTE: These are simlply the defaults that can be updated. 
data_dir = "data/raw/speaker_identity_stims"
[speakerIdentity.builderConfigs.no_labels.additional_special_tokens]
eos_token = "<ts>"


[speakerIdentity.builderConfigs.labels]
variant_name = "labels"
version = "0.0.1"
seed = 42
# NOTE: These are simlply the defaults that can be updated. 
data_dir = "data/raw/speaker_identity_stims"
[speakerIdentity.builderConfigs.labels.additional_special_tokens]
sp_start_token = "<START>"
sp_end_token = "<END>"
eos_token = "|<endoftext>|"
